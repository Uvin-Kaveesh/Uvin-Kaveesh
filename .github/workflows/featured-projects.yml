name: Sync featured project cards

on:
  issues:
    types: [edited]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: featured-project-cards
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'issues' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Sync and commit selected cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 .github/scripts/sync_featured.py
            mkdir -p assets/project-previews/generated
            git add README.md assets/project-previews/generated
            if git diff --cached --quiet; then
              exit 0
            fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync selected featured project cards'
            if git push; then
              exit 0
            fi
            echo "Branch advanced during sync; retrying ($attempt/3)"
          done
          exit 1

